# Render Blueprint (free tier) — creates the API web service automatically.
# Push this repo to GitHub, then in Render: New > Blueprint > connect repo.
#
# DATABASE_URL points at the persistent Neon PostgreSQL instance. After the
# service is created, add these environment variables in the Render dashboard:
#   DATABASE_URL = <Neon connection string>
#   JWT_SECRET   = <long random string>
#
# This repo is the backend itself, so the service root is the repo root.
#
# NOTE: No Render-managed database is provisioned here on purpose — Render's
# free Postgres auto-deletes after 30 days.

services:
  - type: web
    name: minjumart-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22